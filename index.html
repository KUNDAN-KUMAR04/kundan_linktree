<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundan Kumar — Cybersecurity & SOC Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f6fc; --surface: #ffffff; --border: rgba(19,22,41,0.08);
    --ink: #14162b; --muted: #6b7280;
    --indigo: #4f46e5; --sky: #38bdf8; --violet: #8b5cf6; --success: #16a34a;
    --display: 'Sora', sans-serif; --body: 'Inter', sans-serif;
    --avatar-size: 96px; --icon-size: 38px; --page-max-width: 460px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;} }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 800px 500px at 10% -10%, rgba(79,70,229,0.14), transparent 60%),
      radial-gradient(ellipse 700px 600px at 105% 10%, rgba(56,189,248,0.16), transparent 55%),
      radial-gradient(ellipse 600px 500px at 50% 115%, rgba(139,92,246,0.12), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--body);
    display:flex; justify-content:center;
    padding:52px 18px 70px;
  }
  .wrap{ width:100%; max-width:var(--page-max-width); }
  .status-row{ display:flex; justify-content:center; margin-bottom:24px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:8px;
    font-weight:600; font-size:12.5px; color:var(--success);
    background:rgba(22,163,74,0.08); border:1px solid rgba(22,163,74,0.22);
    padding:6px 14px; border-radius:100px;
  }
  .status-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--success); animation:ping 2s infinite; }
  @keyframes ping{ 0%{box-shadow:0 0 0 0 rgba(22,163,74,0.45);} 70%{box-shadow:0 0 0 7px rgba(22,163,74,0);} 100%{box-shadow:0 0 0 0 rgba(22,163,74,0);} }
  .header{ text-align:center; margin-bottom:26px; }
  .avatar{
    width:var(--avatar-size); height:var(--avatar-size); margin:0 auto 18px; border-radius:28px;
    background:linear-gradient(135deg, var(--indigo), var(--violet) 55%, var(--sky));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; font-size:calc(var(--avatar-size) * 0.33); color:#fff;
    box-shadow:0 14px 32px -12px rgba(79,70,229,0.45);
  }
  .name{ font-family:var(--display); font-weight:800; font-size:25px; letter-spacing:-0.01em; margin-bottom:6px; }
  .title{ font-weight:600; font-size:13.5px; color:var(--indigo); margin-bottom:4px; }
  .location{ font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  .bio{ font-size:13.5px; line-height:1.65; color:#3b3e52; max-width:360px; margin:0 auto 16px; }
  .tags{ display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin-bottom:4px; }
  .tag{ font-size:11px; font-weight:600; color:var(--indigo); background:rgba(79,70,229,0.07); border:1px solid rgba(79,70,229,0.14); padding:4px 10px; border-radius:100px; }
  .stats{ display:flex; align-items:center; justify-content:center; gap:22px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin:24px 0 22px; box-shadow:0 1px 2px rgba(19,22,41,0.03); }
  .stat{ text-align:center; }
  .stat-num{ font-family:var(--display); font-weight:700; font-size:18px; background:linear-gradient(135deg, var(--indigo), var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat-label{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
  .stat-divider{ width:1px; height:28px; background:var(--border); }
  .live-tag{ display:flex; align-items:center; gap:5px; font-size:9.5px; font-weight:700; letter-spacing:0.06em; color:#e11d48; text-transform:uppercase; }
  .live-tag .dot{ width:6px; height:6px; border-radius:50%; background:#e11d48; animation:ping 1.4s infinite; }
  .section-label{ font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin:22px 0 10px 4px; }
  .links{ display:flex; flex-direction:column; gap:10px; }
  .card{
    position:relative; display:flex; align-items:center; gap:13px; padding:13px 15px;
    border-radius:14px; background:var(--surface); border:1px solid var(--border);
    text-decoration:none; color:var(--ink);
    opacity:0; transform:translateY(8px); animation:reveal 0.45s ease forwards;
    transition:border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--indigo); box-shadow:0 10px 24px -10px rgba(79,70,229,0.35); }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } }
  .card-icon{ width:var(--icon-size); height:var(--icon-size); border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:calc(var(--icon-size) * 0.45); background:linear-gradient(135deg, var(--icon-a, #4f46e5), var(--icon-b, #8b5cf6)); color:#fff; }
  .card-body{ flex:1; min-width:0; }
  .card-title{ font-family:var(--display); font-weight:600; font-size:14px; margin-bottom:1px; }
  .card-sub{ font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-count{ font-size:10.5px; font-weight:700; color:var(--indigo); background:rgba(79,70,229,0.08); padding:3px 9px; border-radius:100px; flex-shrink:0; min-width:34px; text-align:center; }
  .cert-box{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-top:4px; }
  .cert-item{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:#3b3e52; padding:6px 0; }
  .cert-item:not(:last-child){ border-bottom:1px dashed var(--border); }
  .cert-check{ font-weight:700; flex-shrink:0; }
  .cert-check.done{ color:var(--success); }
  .cert-check.progress{ color:#d97706; }
  .footer{ text-align:center; margin-top:34px; font-size:11px; color:var(--muted); }
  .footer .rule{ width:50px; height:1px; background:var(--border); margin:0 auto 14px; }
  .footer a{ color:var(--muted); }
  .empty-state{ text-align:center; color:var(--muted); font-size:12.5px; padding:20px; }
  .quick-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 22px; }
  .quick-btn{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    color:var(--indigo); background:rgba(79,70,229,0.07); border:1px solid rgba(79,70,229,0.18);
    padding:8px 14px; border-radius:100px; text-decoration:none; transition:transform 0.15s ease, box-shadow 0.2s ease;
  }
  .quick-btn:hover{ transform:translateY(-1px); box-shadow:0 8px 18px -8px rgba(79,70,229,0.35); }
  .about-box{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 17px; margin:4px 0 4px; }
  .about-box p{ font-size:13px; line-height:1.7; color:#3b3e52; }
</style>
</head>

  onSnapshot(themeRef, (snap) => {
    if(!snap.exists()) return;
    const t = snap.data();
    const root = document.documentElement.style;
    if(t.bg) root.setProperty('--bg', t.bg);
    if(t.indigo) root.setProperty('--indigo', t.indigo);
    if(t.violet) root.setProperty('--violet', t.violet);
    if(t.sky) root.setProperty('--sky', t.sky);
    if(t.ink) root.setProperty('--ink', t.ink);
    if(t.surface) root.setProperty('--surface', t.surface);

    if(t.iconSize) root.setProperty('--icon-size', t.iconSize + 'px');
    if(t.maxWidth) root.setProperty('--page-max-width', t.maxWidth + 'px');

    renderQuickActions({
      resumeUrl: t.resumeUrl !== undefined ? t.resumeUrl : DEFAULT_QUICK_LINKS.resumeUrl,
      cvUrl: t.cvUrl !== undefined ? t.cvUrl : DEFAULT_QUICK_LINKS.cvUrl,
      certificatesUrl: t.certificatesUrl !== undefined ? t.certificatesUrl : DEFAULT_QUICK_LINKS.certificatesUrl
    });

    applyAvatar(t.avatarImageUrl || DEFAULT_AVATAR_URL);
  });

  function renderQuickActions(t){
    const box = document.getElementById('quickActions');
    const buttons = [];
    if(t.resumeUrl) buttons.push({ label: "Resume", icon: "📄", url: t.resumeUrl });
    if(t.cvUrl && t.cvUrl !== t.resumeUrl) buttons.push({ label: "CV", icon: "📋", url: t.cvUrl });
    if(t.certificatesUrl) buttons.push({ label: "Certificates", icon: "🏅", url: t.certificatesUrl });
    box.innerHTML = buttons.map(b =>
      `<a class="quick-btn" href="${escapeAttr(b.url)}" target="_blank" rel="noopener">${b.icon} ${escapeHtml(b.label)}</a>`
    ).join('');
  }

  function applyAvatar(url){
    const avatarEl = document.getElementById('avatarEl');
    const avatarImgEl = document.getElementById('avatarImgEl');
    if(url){
      avatarImgEl.src = url;
      avatarImgEl.style.display = 'flex';
      avatarEl.style.display = 'none';
    } else {
      avatarImgEl.style.display = 'none';
      avatarEl.style.display = 'flex';
    }
  }

    document.getElementById('nameEl').textContent = p.name || '';
    document.getElementById('titleEl').textContent = p.title || '';
    document.getElementById('locationEl').textContent = p.location ? `📍 ${p.location}` : '';
    document.getElementById('bioEl').textContent = p.bio || '';
    document.getElementById('footerText').textContent = `${p.name || ''} · ${p.location || ''}`;

    const tagsEl = document.getElementById('tagsEl');
    tagsEl.innerHTML = (p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');

    const statusRow = document.getElementById('statusRow');
    statusRow.innerHTML = p.status
      ? `<span class="status-pill"><span class="dot"></span>${escapeHtml(p.status)}</span>`
      : '';

    const aboutBox = document.getElementById('aboutBox');
    const aboutLabel = document.getElementById('aboutLabel');
    if(p.aboutExtended){
      aboutLabel.style.display = 'block';
      aboutBox.style.display = 'block';
      aboutBox.innerHTML = `<p>${escapeHtml(p.aboutExtended)}</p>`;
    } else {
      aboutLabel.style.display = 'none';
      aboutBox.style.display = 'none';
    }
  }

  // ---- render links, grouped by section in order (falls back to resume defaults) ----
  let clickTotals = {};
  onSnapshot(linksQuery, (snap) => {
    const container = document.getElementById('linksContainer');
    if(snap.empty){
      renderLinks(DEFAULT_LINKS.map((d, i) => ({ id: `default-${i}`, data: d })));
      return;
    }
    const items = [];
    snap.forEach(docSnap => {
      const d = docSnap.data();
      if(d.active === false) return;
      items.push({ id: docSnap.id, data: d });
    });
    renderLinks(items);
  });

  function renderLinks(items){
    const container = document.getElementById('linksContainer');
    clickTotals = {};
    let out = '';
    let lastSection = null;
    let open = false;
    items.forEach(({ id, data: d }) => {
      if(d.section !== lastSection){
        if(open) out += '</div>';
        out += `<div class="section-label">${escapeHtml(d.section || '')}</div><div class="links">`;
        open = true;
        lastSection = d.section;
      }
      clickTotals[id] = d.clicks || 0;
      out += `
        <a class="card" data-id="${id}" href="${escapeAttr(d.url)}" target="_blank" rel="noopener" style="--icon-a:${d.colorA||'#4f46e5'}; --icon-b:${d.colorB||'#8b5cf6'}">
          <span class="card-icon">${d.icon || '🔗'}</span>
          <span class="card-body">
            <span class="card-title">${escapeHtml(d.title || '')}</span>
            <span class="card-sub">${escapeHtml(d.subtitle || '')}</span>
          </span>
          <span class="card-count">${d.clicks || 0}</span>
        </a>`;
    });
    if(open) out += '</div>';
    container.innerHTML = out || '<div class="empty-state">No links added yet. Add some from the admin panel.</div>';

    container.querySelectorAll('.card[data-id]').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.getAttribute('data-id');
        if(id.startsWith('default-')) return; // no doc to update for defaults
        const ref = doc(db, "links", id);
        updateDoc(ref, { clicks: increment(1) }).catch(()=>{});
        if(analytics) logEvent(analytics, 'link_click', { link_id: id });
      });
    });

    updateClickTotal();
  }

  function updateClickTotal(){
    const total = Object.values(clickTotals).reduce((a,b)=>a+b,0);
    document.getElementById('statClicks').textContent = total;
  }

  // ---- render certifications (falls back to resume defaults) ----
  onSnapshot(certsQuery, (snap) => {
    const box = document.getElementById('certBox');
    const label = document.getElementById('certLabel');
    const items = [];
    if(snap.empty){
      DEFAULT_CERTS.forEach(c => items.push(c));
    } else {
      snap.forEach(docSnap => items.push(docSnap.data()));
    }
    if(items.length === 0){ box.style.display='none'; label.style.display='none'; return; }
    label.style.display='block';
    box.style.display='block';
    let html = '';
    items.forEach(d => {
      const cls = d.status === 'done' ? 'done' : 'progress';
      const mark = d.status === 'done' ? '✓' : '⏳';
      html += `<div class="cert-item"><span class="cert-check ${cls}">${mark}</span> ${escapeHtml(d.text||'')}</div>`;
    });
    box.innerHTML = html;
  });

  // ---- profile view counter (creates stats/main if missing, instead of silently skipping) ----
  (async function trackView(){
    try{
      const snap = await getDoc(statsRef);
      if(snap.exists()){
        await updateDoc(statsRef, { profileViews: increment(1) });
      } else {
        await setDoc(statsRef, { profileViews: 1 });
      }
    }catch(e){ /* ignore, keep page working even if this fails */ }
  })();

  onSnapshot(statsRef, (snap) => {
    if(snap.exists()){
      document.getElementById('statViews').textContent = snap.data().profileViews || 0;
    } else {
      document.getElementById('statViews').textContent = 0;
    }
  });

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(str){ return escapeHtml(str); }
</script>

</body>
</html>
